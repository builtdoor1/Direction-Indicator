plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'direction-indicator'
}

repositories {
	maven { url = "https://maven.terraformersmc.com/" } // Mod Menu
	maven { url = "https://maven.shedaniel.me/" }        // Cloth Config
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Used for the client tick event and the world render event. No other dependencies.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: the in-game settings screen. Both are declared in "suggests", not "depends",
	// so the mod still runs with neither installed.
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Exclude only its bundled Fabric API modules, so they don't clash with the version above.
	// Do NOT exclude anything else: javac needs cloth's basic-math on the classpath to resolve
	// the startColorField overloads even though we never name that type.
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
